<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SMPT Portfolio Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f6f3; --panel:#ffffff; --ink:#15201b; --ink-2:#4f5b55; --muted:#7a847f; --rule:#dfe3dd; --rule-2:#eceee9;
  --accent:#0e6b58; --accent-soft:#e1efe9;
  --buy:#1f7a3d; --buy-bg:#e3f1e6; --sell:#b3401f; --sell-bg:#f8e5dd; --warn:#8a5a00; --warn-bg:#fbefd2; --neutral-bg:#eceee9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7;
  --gap:#ffffff;
  --c-smpt:var(--s3); --c-tsx:var(--s1); --c-sp:var(--s2); --c-over:var(--s7); --c-under:var(--s4);
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","PingFang SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111513; --panel:#181d1a; --ink:#e7ece8; --ink-2:#b3bdb7; --muted:#89938d; --rule:#2c3430; --rule-2:#222925;
    --accent:#4fc3a4; --accent-soft:#18332b;
    --buy:#6fd08c; --buy-bg:#17301f; --sell:#f08d6e; --sell-bg:#3a2119; --warn:#f0c060; --warn-bg:#352a12; --neutral-bg:#252b28;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
    --gap:#181d1a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111513; --panel:#181d1a; --ink:#e7ece8; --ink-2:#b3bdb7; --muted:#89938d; --rule:#2c3430; --rule-2:#222925;
  --accent:#4fc3a4; --accent-soft:#18332b;
  --buy:#6fd08c; --buy-bg:#17301f; --sell:#f08d6e; --sell-bg:#3a2119; --warn:#f0c060; --warn-bg:#352a12; --neutral-bg:#252b28;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
  --gap:#181d1a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:28px}
.wrap>*,.agrid>*{min-width:0}
h1,h2,h3{font-family:var(--cond);text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:30px;font-weight:700;line-height:1.1}
h2{font-size:19px;font-weight:600}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--ink-2);max-width:68ch;margin:6px 0 0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* snapshot tiles */
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.lang,.toggle{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--panel)}
.lang button,.toggle button{border:0;background:none;padding:5px 12px;font:500 12px var(--sans);color:var(--ink-2);cursor:pointer}
.lang button+button,.toggle button+button{border-left:1px solid var(--rule)}
.lang button[aria-pressed="true"],.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.snaps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.snap{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.snap:hover{border-color:var(--ink-2)}
.snap[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.snap .d{font:500 12px var(--mono);color:var(--ink-2)}
.snap .v{font:600 22px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.snap .m{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.snap .m b{font-weight:500;color:var(--ink-2)}
.delta-up{color:var(--buy)} .delta-dn{color:var(--sell)}

/* chart */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:18px 18px 16px}
.chart-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.mix{display:grid;grid-template-columns:86px 1fr;gap:8px 12px;align-items:center}
.mix .lab{font:500 12px var(--mono);color:var(--ink-2)}
.mix .lab.sel{color:var(--ink);font-weight:600}
.bar{display:flex;height:26px;gap:2px;cursor:default}
.seg{height:100%;display:flex;align-items:center;justify-content:center;font:500 11px var(--mono);color:#fff;overflow:hidden;white-space:nowrap;min-width:2px}
.seg:first-child{border-radius:4px 0 0 4px}.seg:last-child{border-radius:0 4px 4px 0}
.seg.dim{opacity:.35}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgb(0 0 0 / .12);z-index:20;min-width:170px}
.tip .r{display:flex;justify-content:space-between;gap:14px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:600 15px var(--cond);color:var(--ink-2);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .c{font:500 11px var(--mono);color:var(--muted);margin-left:6px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px}
.search{flex:1 1 220px;max-width:320px;padding:8px 10px;border:1px solid var(--rule);border-radius:5px;background:var(--panel);font:inherit;color:var(--ink)}
.chip{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.toggle-wrap{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dd{padding:6px 8px;border:1px solid var(--rule);border-radius:5px;background:var(--panel);font:inherit;font-size:12.5px;color:var(--ink)}
.ind{display:inline-block;font:500 11px/1.3 var(--sans);color:var(--ink-2);background:var(--neutral-bg);border-radius:3px;padding:2px 6px;white-space:nowrap}
button.ind{border:0;cursor:pointer}
button.ind:hover{color:var(--accent);background:var(--accent-soft)}
.eyebrow button.ind{font:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;background:none;color:inherit;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.eyebrow button.ind:hover{color:var(--accent);background:none;text-decoration-color:currentColor}

.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:6px}
/* A scrolling wrapper traps sticky headers; on wide screens, where the table fits, clip instead so the
   header sticks to the top of the window while the page scrolls. Phones keep sideways scrolling. */
@media (min-width:800px){ .tbl-wrap.stick{overflow:clip} }
/* Narrower screens need sideways scrolling, so the table scrolls in a screen-high box and the header sticks inside it. */
@media (max-width:799px){ .tbl-wrap.stick{max-height:calc(100vh - 24px);overflow:auto} }
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel);position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px var(--rule);cursor:pointer;user-select:none;white-space:nowrap}
th.r,td.r{text-align:right}
th[data-dir="asc"]::after{content:" ↑"} th[data-dir="desc"]::after{content:" ↓"}
tr.grp td{background:var(--bg);font:600 12px var(--cond);letter-spacing:.04em;color:var(--ink-2);padding-block:6px}
tr.grp td .tot{float:right;font:500 12px var(--mono)}
tbody tr.row:hover td{background:var(--accent-soft)}
.tk,.tkd{font:600 13px var(--mono);color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.tk:hover,.tkd:hover{text-decoration-color:currentColor}
.nmb{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.nmb:hover{color:var(--accent);text-decoration-color:currentColor}
.nm{color:var(--ink-2);font-size:13px}
.wbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.wbar span{display:inline-block;height:6px;border-radius:0 3px 3px 0;background:var(--accent);opacity:.55}
.pill{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.04em;padding:4px 7px;border-radius:4px;white-space:nowrap}
.p-buy{background:var(--buy-bg);color:var(--buy)} .p-sell{background:var(--sell-bg);color:var(--sell)}
.p-warn{background:var(--warn-bg);color:var(--warn)} .p-na{background:var(--neutral-bg);color:var(--ink-2)}
.exited{margin-top:12px;font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* trades */
.tl{display:flex;flex-direction:column}
.month{display:grid;grid-template-columns:110px 1fr;gap:0 18px;padding-block:14px;border-top:1px solid var(--rule)}
.month:first-child{border-top:0}
.month .mh{font:600 15px var(--cond);position:sticky;top:8px;align-self:start}
.month .mh small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em}
.tr{display:grid;grid-template-columns:78px 92px 1fr auto;gap:4px 14px;padding:9px 0;border-bottom:1px dashed var(--rule-2);align-items:start}
.tr:last-child{border-bottom:0}
.tr .dt{font:500 12px var(--mono);color:var(--muted);padding-top:2px}
.tr .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.tr .t1{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.tr .sec{font-weight:500}
.tr .rep{font-size:12px;color:var(--muted)}
.tr .pa{font-size:12.5px;color:var(--ink-2);display:grid;grid-template-columns:auto 1fr;gap:1px 8px}
.tr .pa b{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.tr .note{font-size:12px;color:var(--ink-2);font-style:italic}

/* drawer */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .28);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);border-left:1px solid var(--rule);z-index:31;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.drawer .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:none;border:1px solid var(--rule);border-radius:5px;padding:4px 10px;cursor:pointer}
.drawer table{min-width:0}
.drawer .tblx{overflow-x:auto;margin-top:6px}
.drawer .tblx td:first-child{white-space:nowrap}
.drawer .unr2 .muted{display:block;font-size:12px}
.drawer .tblx th{white-space:normal;vertical-align:bottom}
.drawer h3{font-size:14px;color:var(--ink-2)}

.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:4px}
/* analysis */
.agrid{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:4px 0 16px}
.tile{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.tile .l{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tile .v{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:11px var(--mono);fill:var(--muted)}
.chart text.lbl{font:500 12px var(--sans);fill:var(--ink-2)}
.chart .grid{stroke:var(--rule-2)} .chart .zero{stroke:var(--muted)}
.card h3.sh{margin:20px 0 2px;font-size:15px;color:var(--ink)}
.card .note-s{font-size:12.5px;color:var(--ink-2);margin:0 0 8px}
.row-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
details.tv{margin-top:12px}
details.tv summary{cursor:pointer;font-size:12.5px;color:var(--ink-2)}
details.tv .tbl-wrap{margin-top:8px;max-height:360px;overflow:auto}
table.cmp{min-width:520px}
tr.sub td{background:var(--bg);padding:8px 12px 12px}
tr.sub table{min-width:0;background:var(--panel)}
.xp{background:none;border:0;padding:0;cursor:pointer;font:500 13px var(--mono);color:var(--ink);white-space:nowrap}
.xp::before{content:"▸ ";color:var(--muted)} .xp[aria-expanded="true"]::before{content:"▾ "}
.dbar{position:relative;width:120px;height:14px;margin-left:auto}
.dbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--muted)}
.dbar span{position:absolute;top:2px;height:10px}
.dbar .pos{left:50%;border-radius:0 3px 3px 0;background:var(--buy)} .dbar .neg{right:50%;border-radius:3px 0 0 3px;background:var(--sell)}
.dbar .ov{left:50%;border-radius:0 3px 3px 0;background:var(--c-over)} .dbar .un{right:50%;border-radius:3px 0 0 3px;background:var(--c-under)}
.tops{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.tops table{min-width:0}
.tops h4{margin:0 0 6px;font:600 13px var(--cond);color:var(--ink-2)}
.held{color:var(--accent);font-weight:600}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.hchips span{font:500 12px var(--mono);background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:3px 7px}
.ppbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:4px 0 14px}
.muted{color:var(--muted)}
.notes{margin:12px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
/* DCF */
.dgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;margin-top:4px}
.dside h4{margin:14px 0 4px;font:600 13px var(--cond);color:var(--ink-2)}
.dside h4:first-child{margin-top:0}
.dside .toggle{margin:2px 0 4px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);min-height:29px}
.fi{display:inline-flex;align-items:center;gap:4px}
.fi i{font:12px var(--mono);font-style:normal;color:var(--muted);width:12px}
input.sc,input.cell{width:88px;text-align:right;font:13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:3px 6px}
input.cell{width:80px;padding:2px 5px}
input.ov{background:var(--warn-bg);border-color:var(--warn)}
table.proj{min-width:0}
table.proj th{position:static;cursor:default}
table.proj th,table.proj td{padding:4px 8px;white-space:nowrap;vertical-align:middle}
table.proj th.pj{color:var(--accent)}
table.proj td.h{color:var(--muted)}
table.proj tr.b td{font-weight:600}
table.proj tr.s td:first-child{padding-left:20px;color:var(--muted);font-size:12px}
table.sens td.c{box-shadow:inset 0 0 0 2px var(--accent)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:12.5px;margin:6px 0}
.warnbox.infobox{background:var(--neutral-bg);color:var(--ink-2)}
.recbar{display:flex;height:10px;gap:2px;margin:8px 0 2px}
.recbar span{height:100%;min-width:2px}
.recbar span:first-child{border-radius:3px 0 0 3px}.recbar span:last-child{border-radius:0 3px 3px 0}
.dbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-2)}
@media (max-width:760px){
  .dgrid{grid-template-columns:1fr}
  .snaps{grid-template-columns:repeat(2,1fr)}
  .month{grid-template-columns:1fr}
  .month .mh{position:static;margin-bottom:4px}
  .tr{grid-template-columns:70px 1fr}
  .tr .body{grid-column:1 / -1}
  .tr .st{grid-column:2;grid-row:1;justify-self:end}
  .mix{grid-template-columns:70px 1fr}
  .drawer th,.drawer td{padding-inline:6px}
  .tops{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topline"><div class="eyebrow">COMM 371 · Student Managed Portfolio Trust</div>
      <div class="lang" role="group" aria-label="Language / 语言"><button type="button" id="lang-zh" data-l="zh" lang="zh-CN">中文</button><button type="button" id="lang-en" data-l="en" lang="en">EN</button></div></div>
    <h1>SMPT Portfolio Ledger</h1>
    <p class="sub" data-i18n="intro"></p>
  </header>

  <section class="snaps" id="snaps" data-i18n-aria="snapsAria"></section>

  <section class="card" aria-labelledby="mixh">
    <div class="chart-head">
      <div><h2 id="mixh" data-i18n="mixTitle"></h2><div class="sub" style="margin:2px 0 0;font-size:12.5px" data-i18n="mixSub"></div></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="mix" id="mix"></div>
  </section>

  <section>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-h" aria-selected="true"><span data-i18n="tabHold"></span><span class="c" id="hc"></span></button>
      <button class="tab" role="tab" id="tab-t" aria-selected="false"><span data-i18n="tabTrades"></span><span class="c" id="tc"></span></button>
      <button class="tab" role="tab" id="tab-a" aria-selected="false"><span data-i18n="tabAna"></span></button>
      <button class="tab" role="tab" id="tab-d" aria-selected="false"><span data-i18n="tabDcf"></span></button>
    </div>

    <div id="pane-h">
      <div class="toolbar">
        <input class="search" id="hq" type="search" data-i18n-ph="holdSearch">
        <div class="toggle-wrap"><span data-i18n="grpBy"></span><div class="toggle" id="hgrp" role="group" data-i18n-aria="grpBy"><button type="button" data-g="cls" data-i18n="grpCls"></button><button type="button" data-g="ind" data-i18n="grpInd"></button></div></div>
        <div class="chips" id="hcls"></div>
      </div>
      <div class="tbl-wrap stick"><table id="ht"><thead><tr>
        <th data-k="t" data-i18n="colTicker"></th><th data-k="n" data-i18n="colName"></th><th data-k="i" data-i18n="colInd"></th><th class="r" data-k="q" data-i18n="colQty"></th><th class="r" data-k="b" data-i18n="colCost"></th><th class="r" data-k="v" data-i18n="colMv"></th><th class="r" data-k="w" data-i18n="colW"></th><th class="r" data-k="up" data-i18n="colUnr" data-i18n-aria="colUnrTip"></th><th data-k="chg" data-i18n="colChg"></th>
      </tr></thead><tbody></tbody></table></div>

let LANG = (()=>{ try{ const v=localStorage.getItem('smpt-lang'); if(v==='zh'||v==='en') return v; }catch(e){} return /^zh/i.test(navigator.language||'')?'zh':'en'; })();
function T(k,...a){ const v = I18N[LANG][k] ?? I18N.en[k] ?? k; return typeof v==='function' ? v(...a) : v; }
const CN = () => I18N[LANG].cls;
const IN = c => I18N[LANG].ind[c] || c;
const COL = c => `var(--s${CLS.indexOf(c)+1})`;
const fmt = (v,d=0) => v==null?'—':v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money = v => '$'+fmt(v);
const pct = (v,d=1) => (v*100).toFixed(d)+'%';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S = DATA.snaps;
const byT = S.map(s => Object.fromEntries(s.h.map(h=>[h.t,h])));
let cur = S.length-1, hgrp = 'cls', hcls = new Set(), hind = new Set(), hsort = {k:null,dir:'desc'};
let tAct = 'ALL', tEx = 'ALL', tInd = 'ALL';

/* ---------- snapshot tiles ---------- */
function renderSnaps(){
  $('#snaps').innerHTML = S.map((s,i)=>{
    const n = s.h.filter(h=>h.c!=='Cash').length;
    let d = '';
    if(i>0){ const r = s.total/S[i-1].total-1; d = `<span class="${r>=0?'delta-up':'delta-dn'}">${r>=0?'+':''}${pct(r)}</span>`; }
    const prev = i>0?byT[i-1]:null;
    const nw = prev? s.h.filter(h=>h.c!=='Cash'&&h.c!=='Money Market'&&!prev[h.t]).length : null;
    const ex = prev? S[i-1].h.filter(h=>h.c!=='Cash'&&h.c!=='Money Market'&&!byT[i][h.t]).length : null;
    return `<button class="snap" aria-pressed="${i===cur}" data-i="${i}">
      <span class="d">${s.date}</span>
      <span class="v">${money(s.total)}</span>
      <span class="m"><span>${T('nPos',n)}</span>${d?`<span>${T('valChg',d)}</span>`:`<span>${T('firstSnap')}</span>`}${prev?`<span>${T('newExit',nw,ex)}</span>`:''}</span>
    </button>`;}).join('');
  document.querySelectorAll('.snap').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;renderAll();});
}

/* ---------- asset mix ---------- */
function mixOf(i){ const m={}; S[i].h.forEach(h=>m[h.c]=(m[h.c]||0)+h.v); return m; }
function renderMix(){
  $('#legend').innerHTML = CLS.map(c=>`<span><i style="background:${COL(c)}"></i>${CN()[c]}</span>`).join('');
  $('#mix').innerHTML = S.map((s,i)=>{
    const m = mixOf(i);
    return `<div class="lab ${i===cur?'sel':''}">${s.date}</div><div class="bar" data-i="${i}">${CLS.map(c=>{
      const w=(m[c]||0)/s.total; if(!w) return '';
      return `<div class="seg" style="flex:${w} 0 0;background:${COL(c)}" data-c="${esc(c)}">${w>=.07?pct(w,0):''}</div>`;}).join('')}</div>`;
  }).join('');
  const tip = $('#tip');
  document.querySelectorAll('.bar').forEach(bar=>{
    const i=+bar.dataset.i, m=mixOf(i), t=S[i].total;
    bar.onmousemove = e=>{
      const seg = e.target.closest('.seg'); const hc = seg?.dataset.c;
      bar.querySelectorAll('.seg').forEach(x=>x.classList.toggle('dim', !!hc && x.dataset.c!==hc));
      tip.innerHTML = `<div class="num" style="font-weight:600;margin-bottom:4px">${S[i].date}</div>` + CLS.filter(c=>m[c]).map(c=>
        `<div class="r" style="${c===hc?'font-weight:600':'color:var(--ink-2)'}"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${COL(c)};margin-right:6px"></i>${CN()[c]}</span><span class="num">${pct(m[c]/t)} · ${money(m[c])}</span></div>`).join('');
      tip.hidden=false;
      const x=Math.min(e.clientX+14, innerWidth-tip.offsetWidth-8); tip.style.left=x+'px'; tip.style.top=(e.clientY+14)+'px';
    };
    bar.onmouseleave = ()=>{tip.hidden=true; bar.querySelectorAll('.seg').forEach(x=>x.classList.remove('dim'));};
  });
}

/* ---------- holdings ---------- */
function chgOf(h){
  if(cur===0) return {txt:'—',cls:'p-na',s:0};
  const p = byT[cur-1][h.t];
  if(!p) return {txt:T('newPos'),cls:'p-buy',s:3};
  const d = h.q-p.q;
  if(h.c==='Cash'||h.c==='Money Market') return {txt:'—',cls:'p-na',s:0};
  if(Math.abs(d)<1e-6) return {txt:'—',cls:'p-na',s:0};
  return d>0?{txt:'+'+fmt(d),cls:'p-buy',s:2}:{txt:'−'+fmt(-d),cls:'p-sell',s:1};
}
// Unrealized gain/loss: CAD amount and the percentage in listing currency, as in the RBC sheet.
const sgnMoney = v => (v>=0?'+':'−')+'$'+fmt(Math.abs(v));
const unr = h => h.u==null ? '<span class="muted">—</span>' : `<span class="${h.u>=0?'delta-up':'delta-dn'}">${sgnMoney(h.u)}</span>${h.up!=null?` <span class="muted">${spct(h.up)}</span>`:''}`;
const unrSum = g => { const x=g.filter(h=>h.u!=null); if(!x.length) return ''; const u=sum(x.map(h=>h.u)), cost=sum(x.map(h=>h.v-h.u));
  return ` · ${T('unrShort')} <span class="${u>=0?'delta-up':'delta-dn'}">${sgnMoney(u)}${cost>0?` (${spct(u/cost)})`:''}</span>`; };
function renderHold(){
  const s=S[cur], q=$('#hq').value.trim().toLowerCase();
  document.querySelectorAll('#hgrp button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.g===hgrp));
  const itot = {}; s.h.forEach(h=>itot[h.i]=(itot[h.i]||0)+h.v);
  const INDS = Object.keys(itot).sort((a,b)=>itot[b]-itot[a]);
  const fset = hgrp==='cls' ? hcls : hind;
  $('#hcls').innerHTML = hgrp==='cls'
    ? CLS.map(c=>`<button class="chip" aria-pressed="${hcls.has(c)}" data-c="${esc(c)}"><i style="background:${COL(c)}"></i>${CN()[c]}</button>`).join('')
    : INDS.map(c=>`<button class="chip" aria-pressed="${hind.has(c)}" data-c="${esc(c)}">${esc(IN(c))}</button>`).join('');
  if(fset.size) $('#hcls').innerHTML += `<button class="chip" id="hclr">${T('clearFilter')} ×</button>`;
  document.querySelectorAll('#hcls .chip[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c; fset.has(c)?fset.delete(c):fset.add(c); renderHold();});
  if($('#hclr')) $('#hclr').onclick=()=>{ fset.clear(); renderHold(); };
  let rows = s.h.map(h=>({...h,w:h.v/s.total,chg:chgOf(h)}))

/* ---------- analysis ---------- */
const PF = DATA.perf;
const SER = [{k:'s',n:'SMPT',c:'var(--c-smpt)'},{k:'t',n:'S&P/TSX',c:'var(--c-tsx)'},{k:'p',n:'S&P 500',c:'var(--c-sp)'}];
let aWin = 'inc', aBench = 't';
const spct = (v,d=1) => v==null||!isFinite(v)?'—':(v>=0?'+':'−')+Math.abs(v*100).toFixed(d)+'%';
const spp = (v,d=1) => v==null||!isFinite(v)?'—':(v>=0?'+':'−')+Math.abs(v*100).toFixed(d)+' pp';
const num2 = v => v==null||!isFinite(v)?'—':(v<0?'−':'')+Math.abs(v).toFixed(2);
const sum = a => a.reduce((x,y)=>x+y,0);
function winRows(){
  const rows = PF.hpr;
  if(aWin==='inc') return {base:PF.start, rows};
  const cut = new Date(rows.at(-1).e); cut.setFullYear(cut.getFullYear()-(+aWin)); cut.setDate(cut.getDate()+15);
  let bi = 0; rows.forEach((r,i)=>{ if(new Date(r.e)<=cut) bi=i; });
  return {base:rows[bi].e, rows:rows.slice(bi+1)};
}
/* Periods are 3-7 months long: treat log returns as a random walk, so each period's
   variance scales with its length in months, then annualize. */
function stats(rows,k){
  const m=rows.map(r=>r.m), l=rows.map(r=>Math.log(1+r[k])), M=sum(m), mu=sum(l)/M, n=rows.length;
  const vr = sum(l.map((x,i)=>(x-mu*m[i])**2/m[i]))/(n-1);
  let v=1, pk=1, mdd=0; rows.forEach(r=>{v*=1+r[k]; pk=Math.max(pk,v); mdd=Math.min(mdd,v/pk-1);});
  const ann = Math.exp(sum(l)*12/M)-1, vol = Math.sqrt(12*vr);
  const lo = rows.reduce((a,r)=>r[k]<a[k]?r:a), hi = rows.reduce((a,r)=>r[k]>a[k]?r:a);
  return {ann, vol, rv:ann/vol, mdd, cum:v-1, worst:[lo[k],lo.e], best:[hi[k],hi.e]};
}
function rel(rows,k,b){
  const m=rows.map(r=>r.m), M=sum(m), n=rows.length;
  const ls=rows.map(r=>Math.log(1+r[k])), lb=rows.map(r=>Math.log(1+r[b])), la=ls.map((x,i)=>x-lb[i]);
  const mu = l => sum(l)/M;
  const cov = (x,y) => { const a=mu(x), c=mu(y); return sum(x.map((v,i)=>(v-a*m[i])*(y[i]-c*m[i])/m[i]))/(n-1); };
  const S=stats(rows,k), B=stats(rows,b), te=Math.sqrt(12*cov(la,la));
  return {beta:cov(ls,lb)/cov(lb,lb), corr:cov(ls,lb)/Math.sqrt(cov(ls,ls)*cov(lb,lb)), ex:S.ann-B.ann, te, ir:(S.ann-B.ann)/te,
          hit:rows.filter(r=>r[k]>r[b]).length, n};
}
function niceScale(lo,hi,n){
  if(hi===lo){hi+=1;lo-=1;}
  const raw=(hi-lo)/n, mag=10**Math.floor(Math.log10(raw));
  const step=[1,2,2.5,5,10].map(x=>x*mag).find(s=>s>=raw);
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step, t=[];
  for(let v=a; v<=b+step/2; v+=step) t.push(+v.toFixed(10));
  return {lo:a, hi:b, ticks:t};
}
function tipAt(e,html){
  const tip=$('#tip'); tip.innerHTML=html; tip.hidden=false;
  const x=Math.min(e.clientX+14, innerWidth-tip.offsetWidth-8), y=e.clientY+14+tip.offsetHeight>innerHeight? e.clientY-tip.offsetHeight-10 : e.clientY+14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
const hideTip = () => { $('#tip').hidden=true; };
const swatch = c => `<i class="sw" style="background:${c}"></i>`;
const tipRow = (c,l,v,bold) => `<div class="r" style="${bold?'font-weight:600':'color:var(--ink-2)'}"><span>${c?swatch(c)+' ':''}${l}</span><span class="num">${v}</span></div>`;

function drawLine(base,rows){
  const el=$('#pline'), W=Math.max(300,el.clientWidth), sm=W<560, H=sm?230:290;
  const mL=sm?46:58, mR=sm?74:118, mT=10, mB=24, pw=W-mL-mR, ph=H-mT-mB;
  const ts=[base,...rows.map(r=>r.e)].map(d=>Date.parse(d));
  const V=SER.map(s=>{let v=1000; return [1000,...rows.map(r=>v*=1+r[s.k])];});
  const sc=niceScale(Math.min(...V.flat()), Math.max(...V.flat()), sm?4:5);
  const x=t=>mL+(t-ts[0])/(ts.at(-1)-ts[0])*pw, y=v=>mT+(1-(v-sc.lo)/(sc.hi-sc.lo))*ph;
  const y0=new Date(ts[0]).getUTCFullYear()+1, y1=new Date(ts.at(-1)).getUTCFullYear();
  const every=Math.max(1,Math.ceil((y1-y0+1)/(pw/(sm?52:64))));
  let g=sc.ticks.map(v=>`<line class="grid" x1="${mL}" x2="${W-mR}" y1="${y(v)}" y2="${y(v)}"/><text x="${mL-8}" y="${y(v)+4}" text-anchor="end">$${fmt(v)}</text>`).join('');
  for(let yr=y0; yr<=y1; yr++){ if((yr-y0)%every) continue; const xx=x(Date.UTC(yr,0,1)); g+=`<line class="grid" x1="${xx}" x2="${xx}" y1="${H-mB}" y2="${H-mB+4}"/><text x="${xx}" y="${H-6}" text-anchor="middle">${yr}</text>`; }
  const paths=SER.map((s,j)=>`<path d="${V[j].map((v,i)=>(i?'L':'M')+x(ts[i]).toFixed(1)+','+y(v).toFixed(1)).join('')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  // end labels, nudged apart so they never overlap
  const ends=SER.map((s,j)=>({s,v:V[j].at(-1),y:y(V[j].at(-1))})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++) ends[i].y=Math.max(ends[i].y, ends[i-1].y+15);
  const labs=ends.map(e=>`<circle cx="${x(ts.at(-1))}" cy="${y(e.v)}" r="4" fill="${e.s.c}" stroke="var(--panel)" stroke-width="2"/><text class="lbl" x="${x(ts.at(-1))+10}" y="${e.y+4}">${e.s.n}${sm?'':` <tspan class="num" style="fill:var(--muted)">$${fmt(e.v)}</tspan>`}</text>`).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(T('perfTitle'))}">${g}${paths}${labs}
    <g id="lhov" visibility="hidden"><line id="lx" y1="${mT}" y2="${H-mB}" stroke="var(--muted)" stroke-dasharray="3 3"/>${SER.map((s,j)=>`<circle data-j="${j}" r="5" fill="${s.c}" stroke="var(--panel)" stroke-width="2"/>`).join('')}</g>
    <rect x="${mL}" y="${mT}" width="${pw}" height="${ph}" fill="transparent" style="cursor:crosshair"/></svg>`;
  const svg=el.querySelector('svg'), hov=svg.querySelector('#lhov');
  svg.querySelector('rect').onpointermove=e=>{
    const bx=svg.getBoundingClientRect(), px=(e.clientX-bx.left)*W/bx.width;
    let i=0; ts.forEach((t,k)=>{ if(Math.abs(x(t)-px)<Math.abs(x(ts[i])-px)) i=k; });
    hov.setAttribute('visibility','visible'); svg.querySelector('#lx').setAttribute('x1',x(ts[i])); svg.querySelector('#lx').setAttribute('x2',x(ts[i]));
    hov.querySelectorAll('circle').forEach(c=>{const j=+c.dataset.j; c.setAttribute('cx',x(ts[i])); c.setAttribute('cy',y(V[j][i]));});
    const r=rows[i-1];
    tipAt(e,`<div class="num" style="font-weight:600;margin-bottom:4px">${i?esc(r.e):esc(base)}</div>`+SER.map((s,j)=>tipRow(s.c,s.n,`$${fmt(V[j][i])}${r?' · '+spct(r[s.k]):''}`,j===0)).join(''));
  };
  svg.querySelector('rect').onpointerleave=()=>{hov.setAttribute('visibility','hidden'); hideTip();};
}
function barPath(x,w,y0,y1){
  const r=Math.min(4,w/2,Math.abs(y1-y0)), d=y1<y0?1:-1;
  return `M${x},${y0}V${y1+d*r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1+d*r}V${y0}Z`;
}
function drawBars(rows){
  const el=$('#pbars'), W=Math.max(300,el.clientWidth), sm=W<560, H=sm?190:220;
  const mL=sm?46:58, mR=12, mT=10, mB=24, pw=W-mL-mR, ph=H-mT-mB, bn=SER.find(s=>s.k===aBench);
  const a=rows.map(r=>r.s-r[aBench]), sc=niceScale(Math.min(0,...a), Math.max(0,...a), 4);
  const y=v=>mT+(1-(v-sc.lo)/(sc.hi-sc.lo))*ph, band=pw/rows.length, bw=Math.max(1,band-2);
  let g=sc.ticks.map(v=>`<line class="${v===0?'zero':'grid'}" x1="${mL}" x2="${W-mR}" y1="${y(v)}" y2="${y(v)}"/><text x="${mL-8}" y="${y(v)+4}" text-anchor="end">${v>0?'+':v<0?'−':''}${Math.abs(v*100).toFixed(0)}</text>`).join('');
  let last=-1e9, prevYr=null;
  rows.forEach((r,i)=>{ const yr=r.e.slice(0,4), xx=mL+i*band+band/2; if(yr!==prevYr && xx-last>=(sm?34:40)){ g+=`<text x="${xx}" y="${H-6}" text-anchor="middle">${yr}</text>`; last=xx; } prevYr=yr; });
  const bars=a.map((v,i)=>`<path d="${barPath(mL+i*band+1,bw,y(0),y(v))}" fill="${v>=0?'var(--buy)':'var(--sell)'}"/>`).join('');
  const hits=rows.map((r,i)=>`<rect data-i="${i}" x="${mL+i*band}" y="${mT}" width="${band}" height="${ph}" fill="transparent"/>`).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(T('actTitle'))}">${g}${bars}${hits}</svg>`;
  el.querySelectorAll('rect[data-i]').forEach(h=>{
    const i=+h.dataset.i, r=rows[i], st=i?rows[i-1].e:winRows().base;
    h.onpointermove=e=>{ h.setAttribute('fill','var(--accent-soft)'); h.setAttribute('fill-opacity','.5');
      tipAt(e,`<div class="num" style="font-weight:600;margin-bottom:4px">${esc(st)} → ${esc(r.e)}</div>`+tipRow('var(--c-smpt)','SMPT',spct(r.s))+tipRow(bn.c,bn.n,spct(r[aBench]))+
        `<div class="r" style="font-weight:600;margin-top:3px"><span>${a[i]>=0?T('outp'):T('underp')}</span><span class="num">${spp(a[i])}</span></div>`); };
    h.onpointerleave=()=>{ h.setAttribute('fill','transparent'); hideTip(); };
  });
}
function renderAna(){

    <span class="s">${T('cumRet',spct(St[j].cum,0))}</span>${j===0?SER.slice(1).map((b,k)=>`<span class="s">${T('vsB',b.n,spp(St[0].ann-St[k+1].ann))}</span>`).join(''):`<span class="s">${T('idxNote')}</span>`}</div>`).join('');

    ${rows.slice().reverse().map(r=>`<tr><td class="num">${r.e}</td><td class="r num">${r.m}</td>${SER.map(s=>`<td class="r num">${spct(r[s.k])}</td>`).join('')}<td class="r num">${spp(r.s-r.t)}</td><td class="r num">${spp(r.s-r.p)}</td></tr>`).join('')}</tbody></table>`;

      const ex=v[0]-v[1]; done.push({t, l, rs:v[0], rb:v[1], ex, dir:t.act==='BUY'?ex:-ex, days:v[2]}); }); });

}

/* price chart in the ticker drawer: weekly closes, benchmark rebased, proposal markers */
const WEEK = 7*864e5;
function drawPx(el,t,rel){
  const P=DATA.px.w[t]; if(!P) return;
  const bs=DATA.px.bench[P.mkt], Bw=DATA.px.w[bs], t0=Date.parse(P.s);
  const bi = i => Math.round((t0+i*WEEK-Date.parse(Bw.s))/WEEK);
  const b0 = Bw.c[bi(0)], bv = P.c.map((_,i)=>Bw.c[bi(i)]!=null? Bw.c[bi(i)]/b0*P.c[0] : null);
  const W=Math.max(260,el.clientWidth), H=200, mL=44, mR=10, mT=10, mB=22, pw=W-mL-mR, ph=H-mT-mB, n=P.c.length;
  const sc=niceScale(Math.min(...P.c,...bv.filter(v=>v!=null)), Math.max(...P.c,...bv.filter(v=>v!=null)), 4);
  const x=i=>mL+i/(n-1)*pw, y=v=>mT+(1-(v-sc.lo)/(sc.hi-sc.lo))*ph, xi=d=>Math.max(0,Math.min(n-1,Math.round((Date.parse(d)-t0)/WEEK)));
  let g=sc.ticks.map(v=>`<line class="grid" x1="${mL}" x2="${W-mR}" y1="${y(v)}" y2="${y(v)}"/><text x="${mL-6}" y="${y(v)+4}" text-anchor="end">${fmt(v,v%1?1:0)}</text>`).join('');
  const y0=new Date(t0).getUTCFullYear()+1, y1=new Date(t0+(n-1)*WEEK).getUTCFullYear();
  for(let yr=y0; yr<=y1; yr++){ const xx=x((Date.UTC(yr,0,1)-t0)/WEEK); g+=`<text x="${xx}" y="${H-5}" text-anchor="middle">${yr}</text>`; }
  const path=(v,attr)=>`<path d="${v.map((p,i)=>p==null?'':(i&&v[i-1]!=null?'L':'M')+x(i).toFixed(1)+','+y(p).toFixed(1)).join('')}" fill="none" ${attr}/>`;
  const marks=rel.filter(r=>r.pp).flatMap(r=>r.pp.legs.filter(l=>l.k===t&&l.d0).map(l=>{ const i=xi(l.d0), yy=y(P.c[i]), up=r.act==='BUY';

  const svg=el.querySelector('svg'), ln=svg.querySelector('#pxx');
  svg.querySelector('rect').onpointermove=e=>{ const bx=svg.getBoundingClientRect(), i=Math.max(0,Math.min(n-1,Math.round(((e.clientX-bx.left)*W/bx.width-mL)/pw*(n-1))));
    ln.setAttribute('x1',x(i)); ln.setAttribute('x2',x(i)); ln.setAttribute('visibility','visible');
    tipAt(e,`<div class="num" style="font-weight:600;margin-bottom:4px">${new Date(t0+i*WEEK).toISOString().slice(0,10)}</div>`+tipRow('var(--accent)',esc(t),fmt(P.c[i],2),true)+(bv[i]!=null?tipRow('var(--muted)',esc(bs),fmt(bv[i],2)):'')); };
  svg.querySelector('rect').onpointerleave=()=>{ ln.setAttribute('visibility','hidden'); hideTip(); };
}

  const KEY='smpt-dcf'; let mem={};
  try{ mem=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){}

  return {all:()=>mem, get:t=>Object.hasOwn(mem,t)?mem[t]:null, set(t,o){ if(o) mem[t]=o; else delete mem[t]; save(); }, replace(a){ mem=a; save(); }};

function renderDSum(){
  const tot=S.at(-1).total;
  document.querySelectorAll('#dsort button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===dSort));
  document.querySelectorAll('#dgrp button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===dGrp));
  const item=h=>{ const r=dModel(h.t), a=anOf(h.t), m=rsOf(h.t)[0];
    return {h, r, up:okN(r.v?.vps)?r.v.up:null, au:a?.median?a.median/r.s.px-1:null, mu:okN(m?.fv)?m.fv/r.s.px-1:null}; };
  const rows=dHeld().map(item), wrows=dWatch().map(item);  // the watchlist is listed but left out of the portfolio figures
  // value-weighted upside over the holdings each source covers
  const wavg=k=>{ const g=rows.filter(x=>okN(x[k])), w=sum(g.map(x=>x.h.v)); return {v:w?sum(g.map(x=>x.h.v*x[k]))/w:null, n:g.length, w:w/sum(rows.map(x=>x.h.v))}; };
  const P1=wavg('up'), P2=wavg('au');
  const ptile=(l,x)=>`<div class="tile"><span class="l">${l}</span><span class="v ${okN(x.v)?(x.v>=0?'delta-up':'delta-dn'):''}">${spct(x.v)}</span><span class="s">${T('dPortSub',x.n,pct(x.w,0))}</span></div>`;
  const P3=wavg('mu');
  $('#dsumt').innerHTML=ptile(T('dPortOurs'),P1)+(AN?ptile(T('dPortAn'),P2):'')+(P3.n?ptile(T('dPortRs'),P3):'');
  const srt=g=>{ if(dSort==='up') g.sort((a,b)=>(b.up??-Infinity)-(a.up??-Infinity)); if(dSort==='an') g.sort((a,b)=>(b.au??-Infinity)-(a.au??-Infinity)); return g; };
  srt(rows); srt(wrows);
  const gLabel=g=>g?GN(g):T('other');
  const row=({h,r,up,au})=>`<tr class="row"${h.t===dT?' style="background:var(--accent-soft)"':''}><td><button class="tkd" data-t="${esc(h.t)}">${esc(h.t)}</button></td><td class="nm"><button class="nmb" data-t="${esc(h.t)}">${esc(h.n)}</button>${h.w?` <span class="ind">${esc(gLabel(dSec(h.t)))}</span>`:''}</td>
      <td class="r num">${h.w?'—':pct(h.v/tot,2)}</td><td class="r num">${fmt(r.s.px,2)} <span class="muted">${esc(r.c.ccy)}</span></td><td class="r num">${up!=null?fmt(r.v.vps,2):'—'}</td><td class="r num">${spct(up)}</td>
      <td>${up!=null?`<div class="dbar"><span class="${up>=0?'pos':'neg'}" style="width:${Math.min(1,Math.abs(up))*50}%"></span></div>`:''}</td>
      <td class="r num">${okN(au)?fmt(anOf(h.t).median,2):'—'}</td><td class="r num ${okN(au)?(au>=0?'delta-up':'delta-dn'):''}">${spct(au)}</td>
      <td class="r num">${pct(r.disc,1)}</td><td class="r num">${okN(r.v?.tvs)?pct(r.v.tvs,0):'—'}</td>
      <td>${r.eq?`<span class="pill p-na">DDM</span> `:r.c.kind!=='op'?`<span class="pill p-warn">${T('dKind_'+r.c.kind)}</span> `:''}${rsOf(h.t)[0]?`<span class="pill p-na" title="${esc(rsOf(h.t)[0].src)}">FV ${spct(rsOf(h.t)[0].fv/r.s.px-1,0)}</span> `:''}${DStore.get(h.t)?`<span class="pill p-na">✎ ${T('dEdited')}</span>`:''}</td></tr>`;
  const grpRow=(label,n,tail)=>`<tr class="grp"><td colspan="12">${label} <span style="color:var(--muted);font-weight:500">· ${n}${tail.note?` · ${tail.note}`:''}</span>${tail.tot?`<span class="tot">${tail.tot}</span>`:''}</td></tr>`;
  let body;
  if(dGrp==='sec'){
    // one block per sector, largest first, with its weight and value-weighted upside under our model and the median targets
    const by={}; rows.forEach(x=>(by[dSec(x.h.t)||'']??=[]).push(x));
    body=Object.keys(by).sort((a,b)=>sum(by[b].map(x=>x.h.v))-sum(by[a].map(x=>x.h.v))).map(k=>{
      const g=by[k], av=key=>{ const c=g.filter(x=>okN(x[key])), w=sum(c.map(x=>x.h.v)); return w?sum(c.map(x=>x.h.v*x[key]))/w:null; };
      return grpRow(esc(gLabel(k)), g.length, {tot:`${pct(sum(g.map(x=>x.h.v))/tot,1)} · ${T('grpOurs',spct(av('up')))} · ${T('grpAn',spct(av('au')))}`})+g.map(row).join('');
    }).join('');
    wrows.sort((a,b)=>gLabel(dSec(a.h.t)).localeCompare(gLabel(dSec(b.h.t)),LANG));  // stable: keeps the chosen order within a sector
  } else body=rows.map(row).join('');
  if(wrows.length) body+=grpRow(T('watchGrp'), wrows.length, {note:T('watchSub')})+wrows.map(row).join('');
  $('#dsum').innerHTML=`<thead><tr><th>${T('colTicker')}</th><th>${T('colName')}</th><th class="r">${T('colW')}</th><th class="r">${T('dPx')}</th><th class="r">${T('dVps')}</th><th class="r">${T('dUp')}</th><th></th><th class="r">${T('dAn')}</th><th class="r">${T('dAnUp')}</th><th class="r">${T('dDisc')}</th><th class="r">${T('dTvs')}</th><th></th></tr></thead><tbody>${body}</tbody>`;
  $('#dsum').querySelectorAll('.tkd').forEach(b=>b.onclick=()=>{ dT=b.dataset.t; renderDCF(); $('#pane-d').scrollIntoView({behavior:'smooth',block:'start'}); });
  $('#dnotes').innerHTML=T('dNotes',FD.asof).map(n=>`<li>${esc(n)}</li>`).join('');
  bindTk();
}

  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',T(el.dataset.i18nAria)));

  renderAll(); renderTrades(); renderAna(); renderDCF();
  if(openT) openTk(openT);
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>applyLang(b.dataset.l));
applyLang(LANG);
</script>
