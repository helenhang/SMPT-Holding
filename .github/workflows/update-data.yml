# Refresh market data every weekday after the US and TSX close, rebuild index.html and push it,
# so GitHub Pages serves current prices, valuations and analyst targets.
# Holdings snapshots and research reports are not in the repo, so they are still updated by hand.
name: Update market data

on:
  schedule:
    - cron: '30 22 * * 1-5'  # 22:30 UTC: 6:30 pm Toronto in summer, 5:30 pm in winter
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write  # commit and push the refreshed data
  pages: write     # request a Pages rebuild

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance==1.1.0 requests==2.32.5 beautifulsoup4==4.14.3

      # Each fetch may fail on its own (Yahoo rate-limits cloud runners); check_data.py then
      # keeps the committed file, so carry on rather than stop at the first failure.
      - name: Fetch prices, fundamentals and analyst targets
        run: |
          python build/fetch_prices.py || echo "::warning::fetch_prices.py failed"
          python build/fetch_fundamentals.py || echo "::warning::fetch_fundamentals.py failed"
          python build/fetch_analysts.py || echo "::warning::fetch_analysts.py failed"

      - name: Refresh index sector data (Mondays and manual runs)
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$(date -u +%u)" = 1 ]; then
            python build/fetch_sectors.py || echo "::warning::fetch_sectors.py failed"
          fi

      - name: Keep the committed version of any file that came back incomplete
        run: python build/check_data.py

      - name: Build the page
        run: python build/build_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/fundamentals.json data/analysts.json data/sectors.json index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update market data $(date -u +%F)"
          git push

      - name: Ask GitHub Pages to rebuild
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            || echo "::notice::Pages rebuild request not accepted; Pages will pick up the push on its own if it builds from main"
